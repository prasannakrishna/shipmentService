spring.application.name=shipment-service
# Database connection properties
spring.datasource.url=jdbc:postgresql://localhost:5432/shipmentdb
spring.datasource.username=commart
spring.datasource.password=commart
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

axon.axonserver.enabled=false

logging.config=classpath:logback-observability.xml